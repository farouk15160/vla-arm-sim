/**:
  ros__parameters:
    # ------------------------------------------------------------------ server
    # Start it in the policy venv (NOT the ROS environment):
    #   ~/vla_venv/bin/python \
    #       src/groot_vla/groot_vla/smolvla_server.py --port 5555
    policy_host: "127.0.0.1"
    policy_port: 5555
    # ~0.9-1.4 s per forward pass on an RTX 2060. Sized far larger than that
    # because smolvla_server falls back to CPU when the GPU is busy, where a
    # forward pass measured ~25 s. A timeout tuned to the GPU case would turn
    # that graceful fallback into a stream of client-side timeouts.
    policy_timeout_ms: 120000
    api_token: ""

    instruction: "pick up the red cube and place it in the tray"

    # smolvla_server always replies in the nested layout.
    observation_schema: "nested"
    arm_action_key: "single_arm"
    gripper_action_key: "gripper"
    wrist_camera_key: "wrist_view"
    scene_camera_key: "ego_view"
    use_wrist_camera: true
    use_scene_camera: true
    # SmolVLA's processor resizes internally; 224 keeps the ZMQ payload small.
    image_width: 224
    image_height: 224

    # --------------------------------------------------------------- control
    action_space: "joint_position"
    control_rate: 1.0
    execution_horizon: 8
    # 0.2 s per chunk step, not 0.1. A zero-shot policy emits joint targets far
    # from the current pose; asking the controller to cover that in 0.1 s
    # demands a velocity it cannot track, and arm_controller aborts the
    # trajectory with "Holding position due to state tolerance violation".
    # Doubling the step time halves the demanded velocity and keeps the
    # trajectory followable. Each reply now covers 1.6 s of motion.
    action_dt: 0.2

    # ---------------------------------------------------------------- safety
    # Same envelope as the GR00T config. A 450M policy is no more trustworthy
    # than a 3B one.
    # 0.08 rad per chunk step, i.e. 0.4 rad/s at the action_dt above. Tight
    # enough that an out-of-distribution policy moves the arm gently rather
    # than slamming it against the tracking tolerance.
    max_joint_step: 0.08
    # Must exceed the inference period or the watchdog trips on its own latency.
    observation_timeout: 3.0
    enforce_workspace: true
    workspace_frame: "base_link"
    tcp_frame: "tcp_link"
    workspace_bounds: [-0.2, 0.95, -0.75, 0.75, -0.10, 0.85]
    start_enabled: false
    dry_run: false

    gripper_open_position: 0.04
    gripper_closed_position: 0.0
    invert_gripper_action: false
